<!DOCTYPE html>
<html>
<head>
    <title>Student Meal Planner Bot 🍲</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: #065f46;
            color: white;
            padding: 15px;
        }

        .sidebar h3 {
            margin-bottom: 10px;
        }

        .suggestion {
            background: #047857;
            padding: 8px;
            margin: 5px 0;
            border-radius: 5px;
            cursor: pointer;
        }

        .suggestion:hover {
            background: #059669;
        }

        /* Chat Area */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ecfdf5;
        }

        .header {
            background: #065f46;
            color: white;
            padding: 15px;
            font-weight: bold;
        }

        .chatbox {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }

        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 10px;
            max-width: 60%;
        }

        .user {
            background: #10b981;
            color: white;
            margin-left: auto;
        }

        .bot {
            background: #d1fae5;
        }

        .input-area {
            display: flex;
            padding: 10px;
            background: white;
        }

        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            margin-left: 5px;
            padding: 10px;
            border: none;
            background: #065f46;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
    <h3>🍲 Try asking:</h3>

    <div class="suggestion" onclick="quickAsk('cheap meals')">
        Cheap meals
    </div>

    <div class="suggestion" onclick="quickAsk('breakfast ideas')">
        Breakfast ideas
    </div>

    <div class="suggestion" onclick="quickAsk('weekly meal plan')">
        Weekly meal plan
    </div>

    <div class="suggestion" onclick="quickAsk('i am broke what can i eat')">
        I'm broke 😭 what can I eat?
    </div>

    <div class="suggestion" onclick="quickAsk('healthy food')">
        Healthy food options
    </div>
</div>

<!-- Chat Area -->
<div class="chat-container">

    <div class="header">Student Meal Planner Bot 🍲</div>

    <div class="chatbox" id="chatbox"></div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type or speak...">
        <button onclick="sendMessage()">Send</button>
        <button onclick="startVoice()">🎤</button>
    </div>

</div>

<script>
function addMessage(text, type) {
    let chatbox = document.getElementById("chatbox");
    let msg = document.createElement("div");
    msg.className = "message " + type;
    msg.innerText = text;
    chatbox.appendChild(msg);
    chatbox.scrollTop = chatbox.scrollHeight;
}

function sendMessage() {
    let input = document.getElementById("userInput").value;
    if (!input.trim()) return;

    addMessage(input, "user");

    fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ message: input })
    })
    .then(res => res.json())
    .then(data => addMessage(data.response, "bot"));

    document.getElementById("userInput").value = "";
}

function quickAsk(text) {
    document.getElementById("userInput").value = text;
    sendMessage();
}

// ENTER KEY
document.getElementById("userInput").addEventListener("keypress", function(e) {
    if (e.key === "Enter") sendMessage();
});

// VOICE
function startVoice() {
    if (!('webkitSpeechRecognition' in window)) {
        alert("Speech not supported here.");
        return;
    }

    let recognition = new webkitSpeechRecognition();
    recognition.start();

    recognition.onresult = function(event) {
        let text = event.results[0][0].transcript;
        document.getElementById("userInput").value = text;
        sendMessage();
    };
}
</script>

</body>
</html>
