<!DOCTYPE html>
<html>
<head>
    <title>Ramsay The Meal Bot🍲</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            height: 100vh;
            background: #fff7ed;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: #ea580c;
            color: white;
            padding: 20px;
        }

        .sidebar h2 {
            margin-bottom: 15px;
        }

        .suggestion {
            background: rgba(255,255,255,0.2);
            padding: 10px;
            margin: 8px 0;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .suggestion:hover {
            background: rgba(255,255,255,0.35);
            transform: scale(1.03);
        }

        /* Chat Area */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #fb923c;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .chatbox {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .message {
            padding: 12px;
            margin: 8px 0;
            border-radius: 15px;
            max-width: 60%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .user {
            background: #fdba74;
            align-self: flex-end;
        }

        .bot {
            background: #ffffff;
            align-self: flex-start;
        }

        .input-area {
            display: flex;
            padding: 15px;
            background: #fff;
            border-top: 1px solid #eee;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 25px;
            border: 1px solid #ddd;
            outline: none;
        }

        button {
            margin-left: 10px;
            padding: 12px;
            border: none;
            border-radius: 50%;
            background: #ea580c;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #c2410c;
        }
    </style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
    <h2>🍲 Meal Ideas</h2>

    <div class="suggestion" onclick="quickAsk('cheap meals')">Cheap meals</div>
    <div class="suggestion" onclick="quickAsk('breakfast ideas')">Breakfast ideas</div>
    <div class="suggestion" onclick="quickAsk('weekly meal plan')">Weekly meal plan</div>
    <div class="suggestion" onclick="quickAsk('i am broke what can i eat')">I'm broke 😭</div>
    <div class="suggestion" onclick="quickAsk('healthy food')">Healthy food</div>
</div>

<!-- Chat -->
<div class="chat-container">

    <div class="header">🍲 Ramsay The Meal Planner Bot</div>

    <div class="chatbox" id="chatbox"></div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask about meals...">
        <button onclick="sendMessage()">➤</button>
        <button onclick="startVoice()">🎤</button>
    </div>

</div>

<script>
function addMessage(text, type) {
    let chatbox = document.getElementById("chatbox");

    let msg = document.createElement("div");
    msg.className = "message " + type;
    msg.innerText = text;

    chatbox.appendChild(msg);
    chatbox.scrollTop = chatbox.scrollHeight;
}

function sendMessage() {
    let input = document.getElementById("userInput").value;
    if (!input.trim()) return;

    addMessage(input, "user");

    fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ message: input })
    })
    .then(res => res.json())
    .then(data => addMessage(data.response, "bot"));

    document.getElementById("userInput").value = "";
}

function quickAsk(text) {
    document.getElementById("userInput").value = text;
    sendMessage();
}

document.getElementById("userInput").addEventListener("keypress", function(e) {
    if (e.key === "Enter") sendMessage();
});

// Voice
function startVoice() {
    if (!('webkitSpeechRecognition' in window)) {
        alert("Voice not supported here.");
        return;
    }

    let recognition = new webkitSpeechRecognition();
    recognition.start();

    recognition.onresult = function(event) {
        let text = event.results[0][0].transcript;
        document.getElementById("userInput").value = text;
        sendMessage();
    };
}
</script>

</body>
</html>
